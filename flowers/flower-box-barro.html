<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flower Box Barro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f6f3ef;
}

.container{
    width:90%;
    max-width:500px;
    margin:30px auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    margin-bottom:15px;
}

label{
    font-weight:500;
    display:block;
    margin-bottom:8px;
}

select, input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:15px;
    margin-bottom:15px;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:16px;
    cursor:pointer;
}

.calc{
    background:#A67C52;
    color:white;
}

.back{
    background:#444;
    color:white;
    margin-top:10px;
}

.result{
    text-align:center;
    font-size:18px;
    font-weight:600;
    margin-top:10px;
}

.small{
    color:#777;
    font-size:13px;
    text-align:center;
}

</style>

</head>
<body>

<div class="container">

<h1>🪴 Flower Box Barro</h1>

<div class="card">

    <!-- POTES -->
    <label>Tipo de pote</label>
    <select id="pote" onchange="toggleExtras()">
        <option value="pequeno">Pote Pequeno</option>
        <option value="medio">Pote Médio</option>
        <option value="grande">Pote Grande</option>
    </select>

    <!-- ONDULADO -->
    <div id="ondaBox" style="display:none; margin-bottom:15px;">
        <label>
            <input type="checkbox" id="ondulado">
            Pote Grande Ondulado (+2.80€)
        </label>
    </div>

    <!-- COELHO -->
    <label>
        <input type="checkbox" id="coelho">
        Coelho Felpudo (+2.30€)
    </label>

</div>

<!-- FLORES -->
<div class="card">

    <label>Flores Pequenas</label>
    <input type="number" id="peq" value="0" min="0">

    <label>Flores Médias</label>
    <input type="number" id="med" value="0" min="0">

    <label>Flores Grandes</label>
    <input type="number" id="gra" value="0" min="0">

</div>

<button class="btn calc" onclick="calcular()">
    Calcular
</button>

<button class="btn back" onclick="history.back()">
    ← Voltar
</button>

<div class="card">

    <div class="result" id="resultado">
        TOTAL: 0.00€
    </div>

    <div class="small" id="detalhe">
        Escolhe as opções e calcula
    </div>

</div>

</div>

<script>

const precos = {

    pote: {
        pequeno: 19.90,
        medio: 21.00,
        grande: 23.80
    },

    extras: {
        ondulado: 2.80,
        coelho: 2.30
    },

    flores: {
        pequenas: 2.00,
        medias: 3.00,
        grandes: 4.00
    }

};

function toggleExtras(){

    const pote = document.getElementById("pote").value;

    const ondaBox = document.getElementById("ondaBox");

    if(pote === "grande"){
        ondaBox.style.display = "block";
    } else {
        ondaBox.style.display = "none";
        document.getElementById("ondulado").checked = false;
    }

}

function calcular(){

    const pote = document.getElementById("pote").value;

    const ondulado = document.getElementById("ondulado").checked;
    const coelho = document.getElementById("coelho").checked;

    const p = parseInt(document.getElementById("peq").value) || 0;
    const m = parseInt(document.getElementById("med").value) || 0;
    const g = parseInt(document.getElementById("gra").value) || 0;

    // BASE
    let total = precos.pote[pote];

    // EXTRAS
    if(ondulado && pote === "grande"){
        total += precos.extras.ondulado;
    }

    if(coelho){
        total += precos.extras.coelho;
    }

    // FLORES
    total +=
        (p * precos.flores.pequenas) +
        (m * precos.flores.medias) +
        (g * precos.flores.grandes);

    document.getElementById("resultado").innerHTML =
        "TOTAL: " + total.toFixed(2) + "€";

    document.getElementById("detalhe").innerHTML =
        `Base + extras + flores incluídos`;

}

</script>

</body>
</html>
