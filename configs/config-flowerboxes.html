<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Config Flower Boxes</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f6f3ef;
    color:#333;
}

.container{
    width:90%;
    max-width:500px;
    margin:30px auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
    font-size:26px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.item{
    margin-bottom:15px;
}

.item:last-child{
    margin-bottom:0;
}

label{
    display:block;
    font-weight:500;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:15px;
    background:#f5f5f5;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

.back{
    background:#444;
    color:white;
}

</style>

</head>

<body>

<div class="container">

    <h1>🌸 Flower Boxes</h1>

    <div class="card">

        <div class="item">
            <label>Caixa Grande (€)</label>
            <input id="caixaGrande" type="number" step="0.01" readonly>
        </div>

        <div class="item">
            <label>Caixa Média (com peluche) (€)</label>
            <input id="caixaMediaPeluche" type="number" step="0.01" readonly>
        </div>

        <div class="item">
            <label>Caixa Média (sem peluche) (€)</label>
            <input id="caixaMedia" type="number" step="0.01" readonly>
        </div>

        <div class="item">
            <label>Caixa Pequena (€)</label>
            <input id="caixaPequena" type="number" step="0.01" readonly>
        </div>

        <div class="item">
            <label>Pote Pequeno (€)</label>
            <input id="potePequeno" type="number" step="0.01" readonly>
        </div>

        <div class="item">
            <label>Pote Médio (€)</label>
            <input id="poteMedio" type="number" step="0.01" readonly>
        </div>

        <div class="item">
            <label>Pote Grande (€)</label>
            <input id="poteGrande" type="number" step="0.01" readonly>
        </div>

        <div class="item">
            <label>Extra Pote Grande Ondulado (€)</label>
            <input id="extraPoteGrandeOndulado" type="number" step="0.01" readonly>
        </div>

        <div class="item">
            <label>Coelho Felpudo (€)</label>
            <input id="coelhoFelpudo" type="number" step="0.01" readonly>
        </div>

        <div class="item">
            <label>Flores Pequenas (€)</label>
            <input id="floresPequenas" type="number" step="0.01" readonly>
        </div>

        <div class="item">
            <label>Flores Médias (€)</label>
            <input id="floresMedias" type="number" step="0.01" readonly>
        </div>

        <div class="item">
            <label>Flores Grandes (€)</label>
            <input id="floresGrandes" type="number" step="0.01" readonly>
        </div>

        <button class="btn back" onclick="history.back()">
            ← Voltar
        </button>

    </div>

</div>


<script type="module">

import { obterConfig } from "../js/config.js";


async function carregarFlowerBoxes() {

    document.getElementById("caixaGrande").value =
        await obterConfig("flowerBoxes.caixaGrande");


    document.getElementById("caixaMediaPeluche").value =
        await obterConfig("flowerBoxes.caixaMediaComPeluche");


    document.getElementById("caixaMedia").value =
        await obterConfig("flowerBoxes.caixaMediaSemPeluche");


    document.getElementById("caixaPequena").value =
        await obterConfig("flowerBoxes.caixaPequena");


    document.getElementById("potePequeno").value =
        await obterConfig("flowerBoxes.potePequeno");


    document.getElementById("poteMedio").value =
        await obterConfig("flowerBoxes.poteMedio");


    document.getElementById("poteGrande").value =
        await obterConfig("flowerBoxes.poteGrande");


    document.getElementById("extraPoteGrandeOndulado").value =
        await obterConfig("flowerBoxes.extraPoteGrandeOndulado");


    document.getElementById("coelhoFelpudo").value =
        await obterConfig("flowerBoxes.coelhoFelpudo");


    document.getElementById("floresPequenas").value =
        await obterConfig("flowerBoxes.floresPequenas");


    document.getElementById("floresMedias").value =
        await obterConfig("flowerBoxes.floresMedias");


    document.getElementById("floresGrandes").value =
        await obterConfig("flowerBoxes.floresGrandes");

}


carregarFlowerBoxes();

</script>

</body>
</html>
```
