<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Config Cera</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f6f3ef;
            color:#333;
        }

        .container{
            width:90%;
            max-width:500px;
            margin:30px auto;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            font-size:26px;
        }

        .card{
            background:#fff;
            border-radius:20px;
            padding:20px;
            margin-bottom:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        .item{
            margin-bottom:15px;
        }

        .item:last-child{
            margin-bottom:0;
        }

        label{
            display:block;
            font-weight:500;
            margin-bottom:6px;
        }

        input{
            width:100%;
            padding:12px;
            border-radius:12px;
            border:1px solid #ddd;
            font-size:15px;
            background:#f5f5f5;
        }

        small{
            color:#777;
            display:block;
            margin-top:5px;
        }

        .btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:15px;
            font-size:16px;
            cursor:pointer;
            margin-top:10px;
        }

        .back{
            background:#444;
            color:white;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🕯️ Config Cera</h1>

        <div class="card">

            <div class="item">
                <label>Cera Moldes (€/kg)</label>
                <input id="ceraMoldes" type="number" step="0.01" readonly>
                <small>Usado em: (q × preço) / 1000</small>
            </div>

            <div class="item">
                <label>Cera Copos (€/kg)</label>
                <input id="ceraCopos" type="number" step="0.01" readonly>
                <small>Usado em: (q × preço) / 1000</small>
            </div>

            <div class="item">
                <label>Corante (€/g base)</label>
                <input id="corante" type="number" step="0.0001" readonly>
                <small>Fórmula: (q × 0.02) × corante</small>
            </div>

            <div class="item">
                <label>Aroma (€/100ml)</label>
                <input id="aroma" type="number" step="0.01" readonly>
                <small>Fórmula: ((q × 0.02) × aroma) / 100</small>
            </div>

        </div>

        <div class="card">

            <button class="btn back" onclick="history.back()">
                ← Voltar
            </button>

        </div>

    </div>


    <script type="module">

        import { obterConfig } from "../js/config.js";


        async function carregarCera() {

            document.getElementById("ceraMoldes").value =
                await obterConfig("cera.moldes");

            document.getElementById("ceraCopos").value =
                await obterConfig("cera.copos");

            document.getElementById("corante").value =
                await obterConfig("cera.corante");

            document.getElementById("aroma").value =
                await obterConfig("cera.aroma");

        }


        carregarCera();

    </script>

</body>
</html>
