<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Config Jesmonite</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f6f3ef;
    color:#333;
}

.container{
    width:90%;
    max-width:500px;
    margin:30px auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
    font-size:26px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.item{
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:500;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:15px;
    background:#f5f5f5;
}

input:focus{
    outline:none;
    border-color:#A67C52;
}

small{
    color:#777;
    display:block;
    margin-top:5px;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

.back{
    background:#444;
    color:white;
}

.warning{
    font-size:13px;
    color:#b08b5b;
    margin-top:5px;
}

</style>

</head>

<body>

<div class="container">

<h1>🪨 Config Jesmonite</h1>


<!-- ================= DIVISÃO ================= -->

<div class="card">

    <div class="item">

        <label>% Parte A (pó)</label>

        <input
            type="number"
            step="0.01"
            id="percentA"
            readonly
        >

        <small>
            Deve somar 1 com Parte B
        </small>

    </div>


    <div class="item">

        <label>% Parte B (líquido)</label>

        <input
            type="number"
            step="0.01"
            id="percentB"
            readonly
        >

        <small>
            Deve somar 1 com Parte A
        </small>

    </div>


    <div
        class="warning"
        id="checkAB"
    ></div>

</div>


<!-- ================= PREÇOS ================= -->

<div class="card">

    <div class="item">

        <label>Preço Parte A (€/g)</label>

        <input
            type="number"
            step="0.0001"
            id="precoA"
            readonly
        >

    </div>


    <div class="item">

        <label>Preço Parte B (€/g)</label>

        <input
            type="number"
            step="0.0001"
            id="precoB"
            readonly
        >

    </div>

</div>


<!-- ================= PERDAS ================= -->

<div class="card">

    <div class="item">

        <label>Fator de perda</label>

        <input
            type="number"
            step="0.01"
            id="fatorPerda"
            readonly
        >

        <small>
            Ex: desperdício, moldes, etc
        </small>

    </div>

</div>


<!-- ================= CORANTE ================= -->

<div class="card">

    <div class="item">

        <label>Consumo corante (por kg)</label>

        <input
            type="number"
            step="0.0001"
            id="consumoCorante"
            readonly
        >

    </div>


    <div class="item">

        <label>Preço corante (€/g)</label>

        <input
            type="number"
            step="0.0001"
            id="precoCorante"
            readonly
        >

        <small>
            Fórmula: (peso * consumo) * preço
        </small>

    </div>

</div>


<!-- ================= AÇÕES ================= -->

<div class="card">

    <button
        class="btn back"
        onclick="history.back()"
    >
        ← Voltar
    </button>

</div>


</div>


<script type="module">

import { obterConfig } from "../js/config.js";


const a = document.getElementById("percentA");
const b = document.getElementById("percentB");
const check = document.getElementById("checkAB");


function validate(){

    const sum =
        (parseFloat(a.value) || 0) +
        (parseFloat(b.value) || 0);


    if(Math.abs(sum - 1) > 0.001){

        check.innerText =
            "⚠ A soma de A + B deve ser 1. Atual: " +
            sum.toFixed(3);

    } else {

        check.innerText =
            "✔ Distribuição correta";

    }

}


async function carregarJesmonite(){

    a.value =
        await obterConfig("jesmonite.percentA");


    b.value =
        await obterConfig("jesmonite.percentB");


    document.getElementById("precoA").value =
        await obterConfig("jesmonite.precoA");


    document.getElementById("precoB").value =
        await obterConfig("jesmonite.precoB");


    document.getElementById("fatorPerda").value =
        await obterConfig("jesmonite.fatorPerda");


    document.getElementById("consumoCorante").value =
        await obterConfig("jesmonite.consumoCorante");


    document.getElementById("precoCorante").value =
        await obterConfig("jesmonite.precoCorante");


    validate();

}


carregarJesmonite();

</script>

</body>
</html>
```
