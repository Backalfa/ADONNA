<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Configurações - A Donna</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f6f3ef;
    color:#333;
}

.container{
    width:90%;
    max-width:500px;
    margin:auto;
    padding:30px 0;
}

.header{
    margin-bottom:35px;
}

.header h1{
    font-size:30px;
    font-weight:600;
}

.header p{
    color:#777;
    margin-top:5px;
}

.card{

    background:#fff;
    border-radius:20px;
    padding:22px;
    margin-bottom:18px;

    display:flex;
    align-items:center;

    cursor:pointer;

    transition:.2s;

    box-shadow:0 8px 20px rgba(0,0,0,.05);

}

.card:hover{
    transform:translateY(-2px);
}

.icon{

    width:60px;
    height:60px;

    border-radius:16px;

    background:#efe7dc;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:28px;

    margin-right:18px;

}

.info h2{
    font-size:20px;
}

.info p{
    color:#777;
    font-size:14px;
}

.back{

    margin-top:40px;

}

.back button{

    width:100%;
    padding:15px;

    border:none;

    border-radius:18px;

    background:#444;

    color:white;

    font-size:16px;

    cursor:pointer;

}

.back button:hover{
    opacity:.9;
}

</style>

</head>
<body>

<div class="container">

    <div class="header">

        <h1>⚙️ Configurações</h1>
        <p>Gerir preços e parâmetros da aplicação</p>

    </div>

    <div class="card" onclick="location.href='./configs/config-flowerboxes.html'">

        <div class="icon">🌸</div>

        <div class="info">
            <h2>Flower Boxes</h2>
            <p>Caixas, potes e flores</p>
        </div>

    </div>

    <div class="card" onclick="location.href='./configs/config-cera.html'">

        <div class="icon">🕯️</div>

        <div class="info">
            <h2>Ceras</h2>
            <p>Cera, aroma e corantes</p>
        </div>

    </div>

    <div class="card" onclick="location.href='./configs/config-gesso.html'">

        <div class="icon">🏺</div>

        <div class="info">
            <h2>Gesso</h2>
            <p>Gesso e corantes</p>
        </div>

    </div>

    <div class="card" onclick="location.href='./configs/config-jesmonite.html'">

        <div class="icon">🪨</div>

        <div class="info">
            <h2>Jesmonite</h2>
            <p>Pó, líquido e corantes</p>
        </div>

    </div>

    <div class="back">

        <button onclick="history.back()">
            ← Voltar
        </button>

    </div>

</div>

</body>
</html>
